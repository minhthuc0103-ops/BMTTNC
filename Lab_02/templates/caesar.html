<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#e8f4fd; color:#1a2a3a; min-height:100vh; }
        .topbar { display:flex; align-items:center; gap:10px; padding:14px 28px; background:white; border-bottom:1.5px solid #bbdefb; }
        .topbar a { color:#90a4ae; text-decoration:none; font-size:13px; }
        .topbar a:hover { color:#1565c0; }
        .topbar .sep { color:#bbdefb; }
        .topbar .current { font-size:13px; font-weight:600; color:#1565c0; }
        .page { max-width:680px; margin:36px auto; padding:0 20px 60px; }
        .page-title { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
        .page-title .icon { width:50px; height:50px; border-radius:14px; background:#1565c0; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:white; }
        .page-title h2 { font-size:22px; font-weight:700; margin:0; color:#1565c0; }
        .page-title p { font-size:13px; color:#607d8b; margin:3px 0 0; }
        .card-box { background:white; border:1.5px solid #bbdefb; border-radius:16px; padding:28px; margin-bottom:20px; box-shadow:0 2px 12px rgba(21,101,192,0.06); }
        .section-badge { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; padding:5px 12px; border-radius:8px; margin-bottom:22px; background:#e3f2fd; color:#1565c0; border:1px solid #90caf9; }
        .section-badge-dec { background:#f1f8e9; color:#388e3c; border:1px solid #a5d6a7; }
        .form-label { font-size:12px; font-weight:600; color:#607d8b; letter-spacing:0.5px; margin-bottom:8px; display:block; }
        .form-control { background:#f5f9ff !important; border:1.5px solid #bbdefb !important; border-radius:10px !important; color:#1a2a3a !important; font-size:15px !important; padding:11px 16px !important; width:100%; transition:border-color 0.2s; }
        .form-control:focus { outline:none !important; border-color:#1e88e5 !important; background:white !important; box-shadow:0 0 0 3px rgba(30,136,229,0.1) !important; }
        .form-control::placeholder { color:#b0bec5 !important; }
        .form-group { margin-bottom:18px; }
        .btn-enc { border:none; border-radius:10px; padding:11px 28px; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#1565c0,#1e88e5); color:white; transition:opacity 0.2s,transform 0.15s; }
        .btn-enc:hover { opacity:0.88; transform:translateY(-1px); }
        .btn-dec { border:none; border-radius:10px; padding:11px 28px; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#2e7d32,#43a047); color:white; transition:opacity 0.2s,transform 0.15s; }
        .btn-dec:hover { opacity:0.88; transform:translateY(-1px); }
        .result-box { margin-top:18px; background:#e3f2fd; border:1.5px solid #90caf9; border-radius:10px; padding:14px 18px; }
        .result-box-dec { background:#f1f8e9; border-color:#a5d6a7; }
        .result-label { font-size:11px; font-weight:600; color:#1565c0; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
        .result-label-dec { color:#388e3c; }
        .result-value { font-size:20px; font-weight:700; color:#0d47a1; word-break:break-all; }
        .result-value-dec { color:#1b5e20; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/">← Trang chủ</a>
        <span class="sep">›</span>
        <span class="current">Caesar Cipher</span>
    </div>
    <div class="page">
        <div class="page-title">
            <div class="icon">C</div>
            <div>
                <h2>Caesar Cipher</h2>
                <p>Mã hoá dịch chuyển ký tự theo key số nguyên</p>
            </div>
        </div>

        <div class="card-box">
            <div class="section-badge">🔒 Encryption</div>
            <form method="POST" action="/caesar/encrypt">
                <div class="form-group">
                    <label class="form-label">Plain Text</label>
                    <input type="text" class="form-control" name="inputPlainText" placeholder="Nhập văn bản cần mã hoá..." value="{{ plain_text or '' }}" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Key (số nguyên, vd: 3)</label>
                    <input type="number" class="form-control" name="inputKey" placeholder="Nhập key..." value="{{ key or '' }}" required/>
                </div>
                <button type="submit" class="btn-enc">Encrypt →</button>
            </form>
            {% if encrypt_result %}
            <div class="result-box">
                <div class="result-label">Kết quả mã hoá</div>
                <div class="result-value">{{ encrypt_result }}</div>
            </div>
            {% endif %}
        </div>

        <div class="card-box">
            <div class="section-badge section-badge-dec">🔓 Decryption</div>
            <form method="POST" action="/caesar/decrypt">
                <div class="form-group">
                    <label class="form-label">Cipher Text</label>
                    <input type="text" class="form-control" name="inputCipherText" placeholder="Nhập văn bản đã mã hoá..." value="{{ cipher_text or '' }}" required/>
                </div>
                <div class="form-group">
                    <label class="form-label">Key (số nguyên, vd: 3)</label>
                    <input type="number" class="form-control" name="inputKey" placeholder="Nhập key..." value="{{ key or '' }}" required/>
                </div>
                <button type="submit" class="btn-dec">Decrypt →</button>
            </form>
            {% if decrypt_result %}
            <div class="result-box result-box-dec">
                <div class="result-label result-label-dec">Kết quả giải mã</div>
                <div class="result-value result-value-dec">{{ decrypt_result }}</div>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
